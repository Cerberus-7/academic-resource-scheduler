# Optional: everything also runs without Docker (see README).
# Before the first run:  cp backend/.env.example backend/.env  and set SECRET_KEY.
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env
    volumes: ["./backend:/app"]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on: [backend]
